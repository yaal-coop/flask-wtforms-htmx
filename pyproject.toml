[project]
name = "flask-wtforms-htmx"
version = "0.1.0.dev0"
description = "A drop-in FlaskForm that brings wtforms-htmx to Flask-WTF."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.rst"]
maintainers = [
    { name = "Éloi Rivard", email = "eloi@yaal.coop" },
]
keywords = ["wtforms", "htmx", "forms", "flask", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-wtf>=1.2",
    "wtforms-htmx>=0.1.0",
]

[project.urls]
Documentation = "https://flask-wtforms-htmx.readthedocs.io/"
Changes = "https://flask-wtforms-htmx.readthedocs.io/changes/"
"Source Code" = "https://github.com/yaal-coop/flask-wtforms-htmx"
"Issue Tracker" = "https://github.com/yaal-coop/flask-wtforms-htmx/issues"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.1"

[dependency-groups]
doc = [
    "pallets-sphinx-themes>=2.5.0",
    "sphinx>=8.1.0",
    "sphinx-issues>=6.0.0",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
dev = [
    { include-group = "test" },
    "mypy>=1.11",
    "prek>=0.3.9",
    "pytest-xdist>=3.8.0",
    "tox-uv>=1.35.1",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["flask_wtforms_htmx", "tests"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "except ImportError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
src = ["src"]
fix = true
show-fixes = true
output-format = "full"

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C90", # mccabe
    "D",   # pydocstyle
    "E",   # pycodestyle error
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warning
    "SIM",
    "RET",
    "BLE",
    "TRY",
    "ERA",
    "PIE",
    "RUF",
    "DTZ",
    "PTH",
]

ignore = [
    "E501", # line-too-long
    "E722", # bare-except
    "D100", # public module
    "D101", # public class
    "D102", # public method
    "D103", # public function
    "D104", # public package
    "D105", # magic method
    "D106", # nested class
    "D107", # public init
    "D203", # no-blank-line-before-class
    "D213", # multi-line-summary-second-line
    "RUF001",
    "RUF002",
    "RUF003",
    "TRY003", # raise-vanilla-args — dedicated exception classes would be overkill here
]

[tool.ruff.lint.isort]
force-single-line = true
order-by-type = false

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
packages = ["flask_wtforms_htmx"]
mypy_path = "src"
ignore_missing_imports = true

[tool.tox]
requires = ["tox>=4.22", "tox-uv>=1.16"]
env_list = ["py3.11", "py3.12", "py3.13", "py3.14", "py3.15", "minversions", "typing"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = ["test"]
commands = [["pytest", { replace = "posargs", extend = true }]]

[tool.tox.env.typing]
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
commands = [["mypy"]]

[tool.tox.env.minversions]
runner = "uv-venv-runner"
base_python = ["py3.11"]
uv_resolution = "lowest-direct"
dependency_groups = ["test"]
commands = [["pytest", "tests/unit", { replace = "posargs", extend = true }]]
